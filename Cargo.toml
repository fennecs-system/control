[package]
name = "control"
version = "0.1.0"
edition = "2024"
default-run = "control"

[features]
default = ["tui"]
tui = ["dep:control-tui"]
# Test builds only (enabled through the self dev-dependency below): node
# directories never resolve to the operator's real home locations.
test-isolation = ["control-config/test-isolation"]

[[bin]]
name = "control-harness"
path = "src/bin/control-harness.rs"
required-features = ["tui"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
control-context = { path = "crates/context" }
control-mcp = { path = "crates/mcp" }
control-http = { path = "crates/http" }
control-ai = { path = "crates/ai" }
control-core = { path = "crates/core", features = ["serde"] }
control-bot = { path = "crates/bot", features = ["serde"] }
control-effect = { path = "crates/effect" }
control-journal = { path = "crates/journal" }
control-comonad = { path = "crates/comonad" }
control-config = { path = "crates/config" }
control-identity = { path = "crates/identity" }
control-delivery = { path = "crates/delivery" }
control-diff = { path = "crates/diff" }
control-url-names = { path = "crates/url-names" }
control-ingress = { path = "crates/ingress" }
control-client = { path = "crates/client" }
control-discord = { path = "crates/discord" }
control-tui = { path = "crates/tui", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "0.17.14"
base64 = "0.23"
scraper = { version = "0.29", default-features = false }
libc = "0.2"

[dev-dependencies]
# Alternate-driver conformance only; production runtime remains unchanged.
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
# Every test build of the binary links a library whose node directories are
# isolated; `#[cfg(test)]` alone would not reach the library from binary tests.
control = { path = ".", default-features = false, features = ["test-isolation"] }


[workspace]
members = ["crates/context", "crates/mcp", "crates/http", "crates/ai", "crates/core", "crates/effect", "crates/bot", "crates/comonad", "crates/journal", "crates/config", "crates/identity", "crates/delivery", "crates/diff", "crates/url-names", "crates/ingress", "crates/client", "crates/tui", "crates/discord"]
exclude = ["web"]
