[package]
name = "control"
version = "0.1.0"
edition = "2021"
default-run = "control"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
control-context = { path = "crates/context" }
control-http = { path = "crates/http" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.28"
ring = "0.17.14"
base64 = "0.22"
scraper = { version = "0.27", default-features = false }
libc = "0.2"


[workspace]
members = ["crates/context", "crates/http"]
exclude = ["web"]
