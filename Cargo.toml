[package]
name = "control"
version = "0.1.0"
edition = "2024"
default-run = "control"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
control-context = { path = "crates/context" }
control-http = { path = "crates/http" }
control-ai = { path = "crates/ai" }
control-core = { path = "crates/core", features = ["serde"] }
control-bot = { path = "crates/bot", features = ["serde"] }
control-effect = { path = "crates/effect" }
control-journal = { path = "crates/journal" }
control-comonad = { path = "crates/comonad" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29"
ring = "0.17.14"
base64 = "0.23"
scraper = { version = "0.29", default-features = false }
libc = "0.2"


[workspace]
members = ["crates/context", "crates/http", "crates/ai", "crates/core", "crates/effect", "crates/bot", "crates/comonad", "crates/journal"]
exclude = ["web"]
