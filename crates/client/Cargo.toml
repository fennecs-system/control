[package]
name = "control-client"
version = "0.1.0"
edition = "2024"

[features]
# Lets the terminal's tests build a `Hive` against a local fixture server.
fixture = []

[dependencies]
control-config = { path = "../config" }
control-identity = { path = "../identity" }
control-context = { path = "../context" }
control-effect = { path = "../effect" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
control-config = { path = "../config", features = ["test-isolation"] }
