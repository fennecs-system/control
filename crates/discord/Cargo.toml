[package]
name = "control-discord"
version = "0.1.0"
edition.workspace = true

[dependencies]
control-client = { path = "../client" }
control-delivery = { path = "../delivery" }
control-diff = { path = "../diff" }
control-ingress = { path = "../ingress" }
control-config = { path = "../config" }
control-identity = { path = "../identity" }
control-context = { path = "../context" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17.14"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[dev-dependencies]
control-config = { path = "../config", features = ["test-isolation"] }
control-journal = { path = "../journal" }
