<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control</title><link rel="stylesheet" href="/style.css"></head>
<body>
<aside class="sidebar">
  <a href="/" class="brand"><span class="brand-icon" aria-hidden="true">⌘</span>CONTROL<span class="version">/ 0.1</span></a>
  <div class="workspace"><span class="dot"></span><div>Local workspace<small>control.local</small></div></div>
  <div class="nav-label">WORKSPACE</div>
  <nav aria-label="Workspace">{{navigation}}</nav>
  <div class="sidebar-bottom"><div class="profile"><span class="avatar">OP</span><div>Operator<small>Local access</small></div></div></div>
</aside>
<div class="shell">
  <header><div class="header-left"><a class="new-chat-link" href="/chats?new=1"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>New chat</a><span class="header-context">{{page_title}}</span></div><div class="header-right">{{page_discussion}}<a class="node-link" href="/?view=nodes"><span class="node-indicator" aria-hidden="true"></span>Local</a></div></header>
  <div class="body-grid {{layout_class}}">{{section_navigation}}<main>{{content}}<div class="bottom-note"><span>⌘ CONTROL</span></div></main></div>
</div>
</body></html>
